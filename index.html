<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <script>
      // 앱이 뜨기 전에 저장된 화면 모드(라이트·다크)를 먼저 적용해서, 처음 열 때 하얗게 번쩍이지 않게 한다.
      // (src/lib/ui.tsx 의 테마 설정과 같은 규칙: 'weekendar-theme' 값, 없으면 기기 설정)
      ;(function () {
        var pref = 'system'
        try { pref = localStorage.getItem('weekendar-theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#000000' : '#f5f5f7')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
